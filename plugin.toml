name = "credential-guard"
version = "0.1.0"
entry = "credential_guard:register"
description = "Stdlib-only credential storage and leak prevention: never in a prompt, never in a log"
requires = ["picoagent>=0.1"]
skills = ["skills"]

# Declared here as well as through `api.declare_required` in register(): a plugin the trust
# check refuses never reaches register(), so a runtime declaration cannot cover the case where
# this plugin is the one that went missing.
required = true
required_reason = """\
without it the shell tool is the built-in one, which passes every environment variable, \
API keys included, to whatever the model runs"""
