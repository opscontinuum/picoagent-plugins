name = "permission-gate"
version = "0.1.0"
entry = "permission_gate:register"
description = "Ask before destructive shell commands; deny writes to protected paths; /yolo toggle"
requires = ["picoagent>=0.1"]
skills = ["skills"]

# Declared here as well as through `api.declare_required` in register(): a plugin the trust
# check refuses never reaches register(), and this plugin being absent is the one case where
# the session runs with no check on destructive commands and nobody chose that.
required = true
required_reason = "this session's only check on destructive commands and protected paths"
